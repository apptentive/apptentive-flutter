plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

group 'com.apptentive.apptentive_flutter'
version '1.0'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

android {
    compileSdk 35
    namespace = 'com.apptentive.apptentive_flutter'

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
        freeCompilerArgs += ['-opt-in=apptentive.com.android.core.InternalUseOnly']
    }

    defaultConfig {
        minSdk 24
    }
}

dependencies {
    implementation 'com.apptentive:apptentive-kit-android:7.4.0'
    testImplementation 'junit:junit:4.13.2'
}
